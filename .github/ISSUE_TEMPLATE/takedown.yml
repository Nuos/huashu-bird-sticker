name: My photo was used / 用了我的照片
description: You took the reference photo for a sticker and want it replaced or removed / 你是某张贴纸参考照的作者，希望替换或撤下
labels: [takedown]
body:
  - type: input
    id: species
    attributes:
      label: Scientific name / 学名
    validations:
      required: true
  - type: input
    id: photo
    attributes:
      label: Your photo page / 你的照片页面
    validations:
      required: true
  - type: markdown
    attributes:
      value: We will replace or remove the sticker within 7 days. You can also email alchaincyf@gmail.com. / 我们会在7天内替换或撤下，也可以发邮件到alchaincyf@gmail.com。
